<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhysVis - 物理题目可视化系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #0a0e27;
            overflow: hidden;
            color: #fff;
        }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .panel { position: fixed; z-index: 10; background: rgba(15,20,40,0.95); backdrop-filter: blur(20px); border-radius: 16px; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); overflow-y: auto; }
        .panel::-webkit-scrollbar { width: 4px; }
        .panel::-webkit-scrollbar-thumb { background: rgba(123,47,255,0.3); border-radius: 2px; }

        .top-nav { position: fixed; top: 0; left: 0; right: 0; height: 52px; z-index: 20; background: rgba(10,14,39,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(123,47,255,0.3); display: flex; align-items: center; padding: 0 20px; gap: 16px; }
        .nav-logo { font-size: 18px; font-weight: 700; background: linear-gradient(90deg,#00d4ff,#7b2fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; }
        .nav-sep { width: 1px; height: 24px; background: rgba(255,255,255,0.15); }
        .tab { padding: 7px 14px; background: rgba(123,47,255,0.15); border: 1px solid rgba(123,47,255,0.25); border-radius: 8px; color: #fff; font-size: 12px; cursor: pointer; transition: all 0.3s; white-space: nowrap; }
        .tab:hover { background: rgba(123,47,255,0.3); }
        .tab.active { background: linear-gradient(135deg,rgba(123,47,255,0.4),rgba(0,212,255,0.3)); border-color: #00d4ff; box-shadow: 0 0 12px rgba(0,212,255,0.2); }
        .nav-btn { padding: 7px 14px; background: rgba(0,212,255,0.15); border: 1px solid rgba(0,212,255,0.3); border-radius: 8px; color: #00d4ff; font-size: 12px; cursor: pointer; transition: all 0.3s; }
        .nav-btn:hover { background: rgba(0,212,255,0.3); }

        .problem-panel { top: 64px; left: 16px; width: 400px; max-height: calc(100vh - 80px); border: 1px solid rgba(123,47,255,0.3); }
        .problem-panel h1 { font-size: 18px; font-weight: 600; background: linear-gradient(90deg,#00d4ff,#7b2fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-bottom: 6px; }
        .problem-panel .source { font-size: 12px; color: rgba(255,200,0,0.9); font-weight: 600; text-align: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid rgba(123,47,255,0.3); }
        .problem-text { font-size: 13px; line-height: 1.8; color: rgba(255,255,255,0.9); margin-bottom: 16px; }
        .problem-text strong { color: #00d4ff; }
        .formula { background: rgba(123,47,255,0.15); padding: 10px 14px; border-radius: 8px; border-left: 3px solid #7b2fff; margin: 10px 0; font-family: 'Times New Roman',serif; font-size: 14px; color: #ffc800; text-align: center; }
        .options-list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
        .option-item { background: rgba(123,47,255,0.1); border: 1px solid rgba(123,47,255,0.25); border-radius: 10px; padding: 12px 14px; cursor: pointer; transition: all 0.3s; display: flex; align-items: flex-start; gap: 10px; }
        .option-item:hover { background: rgba(123,47,255,0.2); transform: translateX(3px); }
        .option-item.selected { border-color: #00d4ff; background: rgba(0,212,255,0.1); box-shadow: 0 0 16px rgba(0,212,255,0.15); }
        .option-item.correct { border-color: #00ff88; background: rgba(0,255,136,0.08); }
        .option-item.wrong { border-color: #ff4444; background: rgba(255,68,68,0.08); }
        .opt-letter { width: 26px; height: 26px; background: linear-gradient(135deg,#7b2fff,#00d4ff); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
        .opt-text { font-size: 13px; line-height: 1.5; color: rgba(255,255,255,0.9); }
        .answer-box { margin-top: 14px; padding: 14px; background: rgba(0,255,136,0.08); border: 1px solid rgba(0,255,136,0.3); border-radius: 10px; font-size: 12px; line-height: 1.8; color: rgba(255,255,255,0.85); display: none; }
        .answer-box.visible { display: block; }
        .answer-box strong { color: #00ff88; }

        .control-panel { top: 64px; right: 16px; width: 280px; border: 1px solid rgba(0,212,255,0.2); }
        .sec-title { font-size: 12px; font-weight: 600; color: #00d4ff; letter-spacing: 2px; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid rgba(0,212,255,0.2); text-transform: uppercase; }
        .btn-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .btn { flex: 1; padding: 10px; background: rgba(123,47,255,0.2); border: 1px solid rgba(123,47,255,0.3); border-radius: 8px; color: #fff; font-size: 12px; cursor: pointer; transition: all 0.3s; }
        .btn:hover { background: rgba(123,47,255,0.35); }
        .btn.active { background: linear-gradient(135deg,#7b2fff,#00d4ff); border-color: transparent; }
        .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
        .mode-btn { padding: 8px; background: rgba(123,47,255,0.15); border: 1px solid rgba(123,47,255,0.3); border-radius: 6px; color: #fff; font-size: 11px; cursor: pointer; transition: all 0.3s; }
        .mode-btn:hover { background: rgba(123,47,255,0.3); }
        .mode-btn.active { background: rgba(123,47,255,0.4); border-color: #00d4ff; }
        .param-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 12px; }
        .param-label { color: rgba(255,255,255,0.6); }
        .param-val { color: #00d4ff; font-family: 'Consolas',monospace; font-weight: 600; }
        .param-box { background: rgba(0,0,0,0.25); padding: 10px; border-radius: 8px; border-left: 3px solid #00ff88; margin-bottom: 14px; }
        .check-label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,0.8); cursor: pointer; margin-bottom: 6px; }
        .check-label input { width: 14px; height: 14px; cursor: pointer; }
        .section { margin-bottom: 16px; }

        .info-panel { bottom: 16px; left: 16px; width: 380px; border: 1px solid rgba(0,255,136,0.2); }
        .info-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
        .info-cell { background: rgba(0,255,136,0.06); padding: 10px; border-radius: 6px; text-align: center; }
        .info-lbl { font-size: 10px; color: rgba(255,255,255,0.5); letter-spacing: 1px; margin-bottom: 3px; }
        .info-val { font-family: 'Consolas',monospace; font-size: 14px; color: #00ff88; font-weight: 700; }

        .deriv-panel { bottom: 16px; left: 416px; width: 360px; max-height: calc(100vh - 80px); border: 1px solid rgba(255,200,0,0.3); }
        .deriv-step { margin-bottom: 12px; padding: 12px; background: rgba(0,0,0,0.25); border-radius: 8px; border-left: 3px solid #ffc800; }
        .deriv-step.highlight { border-left-color: #00ff88; background: rgba(0,255,136,0.06); }
        .deriv-title { font-size: 13px; font-weight: 700; color: #ffc800; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .deriv-num { width: 20px; height: 20px; background: linear-gradient(135deg,#ffc800,#ff8800); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #000; }
        .deriv-line { font-family: 'Times New Roman','Consolas',monospace; font-size: 13px; color: rgba(255,255,255,0.85); padding: 2px 0; line-height: 1.7; }
        .eq { color: #00d4ff; font-weight: 600; }
        .res { color: #00ff88; font-weight: 700; font-size: 14px; }
        .wrong { color: #ff4444; text-decoration: line-through; }
        .note { color: rgba(255,200,0,0.8); font-size: 11px; font-style: italic; }
        .conclusion { margin-top: 6px; padding: 6px 10px; border-radius: 5px; font-size: 12px; font-weight: 600; }
        .conclusion.ok { color: #00ff88; background: rgba(0,255,136,0.1); border: 1px solid rgba(0,255,136,0.3); }
        .conclusion.no { color: #ff4444; background: rgba(255,68,68,0.1); border: 1px solid rgba(255,68,68,0.3); }
        .deriv-tabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
        .deriv-tab { padding: 4px 10px; background: rgba(255,200,0,0.1); border: 1px solid rgba(255,200,0,0.3); border-radius: 5px; color: #ffc800; font-size: 11px; cursor: pointer; }
        .deriv-tab:hover { background: rgba(255,200,0,0.2); }
        .deriv-tab.active { background: rgba(255,200,0,0.3); border-color: #ffc800; }

        .legend-panel { bottom: 16px; right: 16px; border: 1px solid rgba(123,47,255,0.2); padding: 14px; }
        .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; }
        .legend-item:last-child { margin-bottom: 0; }
        .lc { width: 20px; height: 3px; border-radius: 1px; }
        .lc.electron { background: #00ffff; width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 6px #00ffff; }
        .lc.traj { background: linear-gradient(90deg,#00ff88,#00d4ff); }
        .lc.plate-r { background: #ff4444; }
        .lc.plate-l { background: #4488ff; }
        .lc.bfield { background: #fff; width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #000; }

        .loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0e27; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s; }
        .loading.hidden { opacity: 0; pointer-events: none; }
        .spinner { width: 50px; height: 50px; border: 3px solid rgba(123,47,255,0.2); border-top-color: #7b2fff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 9999; background: rgba(255,68,68,0.15); border: 1px solid rgba(255,68,68,0.5); border-radius: 16px; padding: 30px; text-align: center; max-width: 500px; }
        .error-msg h2 { color: #ff4444; margin-bottom: 12px; }
        .error-msg p { color: rgba(255,255,255,0.7); font-size: 13px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div style="margin-top:16px;font-size:13px;color:rgba(255,255,255,0.5);">初始化中...</div>
    </div>
    <div id="canvas-container"></div>

    <div class="top-nav">
        <div class="nav-logo">PhysVis</div>
        <div class="nav-sep"></div>
        <div id="tabs" style="display:flex;gap:6px;flex:1;"></div>
        <button class="nav-btn" id="btn-reveal">答案</button>
    </div>

    <div class="panel problem-panel" id="problem-panel"></div>
    <div class="panel control-panel" id="control-panel"></div>
    <div class="panel info-panel" id="info-panel"></div>
    <div class="panel deriv-panel" id="deriv-panel"></div>
    <div class="panel legend-panel">
        <div class="sec-title" style="color:#7b2fff;border-bottom-color:rgba(123,47,255,0.2);">图例</div>
        <div class="legend-item"><div class="lc electron"></div>带电粒子</div>
        <div class="legend-item"><div class="lc traj"></div>运动轨迹</div>
        <div class="legend-item"><div class="lc plate-r"></div>正极板</div>
        <div class="legend-item"><div class="lc plate-l"></div>负极板</div>
        <div class="legend-item"><div class="lc bfield">×</div>磁场 ⊗</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="physim/dist/physim.js"></script>
    <script src="js/framework.js"></script>
    <script src="templates/scene-templates.js"></script>
    <script src="problems/baiyin-sanmo.js"></script>
    <script src="problems/velocity-selector.js"></script>
    <script src="problems/parallel-plate-electric.js"></script>

    <script>
    (function() {
        'use strict';

        // ================================================================
        //  Renderer3D - 封装所有 Three.js 渲染逻辑
        //  职责: 场景/相机/灯光/Group管理、3D对象创建、粒子渲染
        // ================================================================
        const Renderer3D = {
            scene: null,
            camera: null,
            renderer: null,
            controls: null,
            groups: {},

            init(container) {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x0a0e27);

                this.camera = new THREE.PerspectiveCamera(
                    50, window.innerWidth / window.innerHeight, 0.1, 1000
                );
                this.camera.position.set(0, 0, 12);

                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                container.appendChild(this.renderer.domElement);

                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;

                this.scene.add(new THREE.AmbientLight(0x404060, 0.6));
                const dir = new THREE.DirectionalLight(0xffffff, 0.8);
                dir.position.set(5, 10, 10);
                this.scene.add(dir);

                ['plates', 'fields', 'particles', 'trails', 'hitPoints', 'annotations'].forEach(n => {
                    this.groups[n] = new THREE.Group();
                    this.groups[n].name = n;
                    this.scene.add(this.groups[n]);
                });

                window.addEventListener('resize', () => this.onResize());
            },

            onResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            },

            clearGroup(name) {
                const g = this.groups[name];
                if (!g) return;
                while (g.children.length > 0) {
                    const c = g.children[0];
                    g.remove(c);
                    if (c.geometry) c.geometry.dispose();
                    if (c.material) c.material.dispose();
                }
            },

            clearAll() {
                Object.keys(this.groups).forEach(n => this.clearGroup(n));
            },

            applyViewport(vp) {
                if (!vp) return;
                const cx = (vp.xRange[0] + vp.xRange[1]) / 2;
                const cy = (vp.yRange[0] + vp.yRange[1]) / 2;
                const sz = Math.max(vp.xRange[1] - vp.xRange[0], vp.yRange[1] - vp.yRange[0]);
                this.camera.position.set(cx, cy, sz * 1.5);
                this.controls.target.set(cx, cy, 0);
                this.controls.update();
            },

            buildSceneFromSpec(spec) {
                this.clearAll();
                spec.objects.forEach(o => this.addObject(o));
                if (spec.render.showFieldLines) {
                    spec.fields.forEach(f => this.addField(f, spec));
                }
                this.applyViewport(spec.viewport);
            },

            addObject(o) {
                switch (o.type) {
                    case PhysVis.ObjectTypes.PLATE: this.addPlate(o); break;
                    case PhysVis.ObjectTypes.EMITTER: this.addEmitter(o); break;
                    case PhysVis.ObjectTypes.POINT_CHARGE: this.addPointCharge(o); break;
                }
            },

            addPlate(o) {
                const isVert = o.vertical;
                const geom = isVert
                    ? new THREE.BoxGeometry(o.width || 0.15, o.thickness || 12, 0.1)
                    : new THREE.BoxGeometry(o.width || 10, o.thickness || 0.15, 0.1);
                const mat = new THREE.MeshPhongMaterial({
                    color: o.color || (o.polarity === '+' ? 0xff4444 : 0x4488ff),
                    emissive: o.polarity === '+' ? 0x441111 : 0x111144,
                    shininess: 80
                });
                const mesh = new THREE.Mesh(geom, mat);
                mesh.position.set(o.x || 0, o.y || 0, o.z || 0);
                this.groups.plates.add(mesh);
            },

            addEmitter(o) {
                const geom = new THREE.SphereGeometry(o.radius || 0.15, 32, 32);
                const mat = new THREE.MeshPhongMaterial({ color: 0xffff00, emissive: 0x888800, shininess: 100 });
                const mesh = new THREE.Mesh(geom, mat);
                mesh.position.set(o.x || 0, o.y || 0, o.z || 0);
                this.groups.plates.add(mesh);

                const ring = new THREE.Mesh(
                    new THREE.RingGeometry(0.25, 0.35, 32),
                    new THREE.MeshBasicMaterial({ color: 0xffff00, side: THREE.DoubleSide })
                );
                ring.position.set(o.x || 0, o.y || 0, 0.06);
                this.groups.plates.add(ring);
            },

            addPointCharge(o) {
                const geom = new THREE.SphereGeometry(o.radius || 0.3, 32, 32);
                const mat = new THREE.MeshPhongMaterial({
                    color: o.polarity === '+' ? 0xff4444 : 0x4488ff,
                    emissive: o.polarity === '+' ? 0xff2222 : 0x2222ff,
                    shininess: 100
                });
                const mesh = new THREE.Mesh(geom, mat);
                mesh.position.set(o.x || 0, o.y || 0, o.z || 0);
                this.groups.plates.add(mesh);
            },

            addField(field, spec) {
                if (field.type === 'magnetic') this.addMagneticSymbols(field, spec);
                if (field.type === 'electric') this.addElectricArrows(field, spec);
            },

            addMagneticSymbols(field, spec) {
                const spacing = 1.2;
                const vp = spec.viewport;
                const region = field.region;
                for (let x = Math.ceil(vp.xRange[0]); x <= Math.floor(vp.xRange[1]); x += spacing) {
                    for (let y = Math.ceil(vp.yRange[0]); y <= Math.floor(vp.yRange[1]); y += spacing) {
                        if (region && (x < region.x1 || x > region.x2 || y < region.y1 || y > region.y2)) continue;
                        const sz = 0.12;
                        const mat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 });
                        this.groups.fields.add(new THREE.Line(
                            new THREE.BufferGeometry().setFromPoints([
                                new THREE.Vector3(x - sz, y - sz, 0.05),
                                new THREE.Vector3(x + sz, y + sz, 0.05)
                            ]), mat
                        ));
                        this.groups.fields.add(new THREE.Line(
                            new THREE.BufferGeometry().setFromPoints([
                                new THREE.Vector3(x - sz, y + sz, 0.05),
                                new THREE.Vector3(x + sz, y - sz, 0.05)
                            ]), mat
                        ));
                    }
                }
            },

            addElectricArrows(field, spec) {
                const dir = new THREE.Vector3(field.x || 0, field.y || 0, field.z || 0).normalize();
                const vp = spec.viewport;
                const spacing = 1.0;
                const region = field.region;
                for (let x = vp.xRange[0] + 0.5; x < vp.xRange[1]; x += spacing) {
                    for (let y = vp.yRange[0] + 0.5; y < vp.yRange[1]; y += spacing) {
                        if (region && (x < region.x1 || x > region.x2 || y < region.y1 || y > region.y2)) continue;
                        const arrow = new THREE.ArrowHelper(dir, new THREE.Vector3(x, y, 0), 0.8, 0xff8800, 0.15, 0.08);
                        this.groups.fields.add(arrow);
                    }
                }
            },

            updateParticles(particles) {
                this.clearGroup('particles');
                this.clearGroup('hitPoints');

                particles.forEach(p => {
                    if (p.alive) {
                        const mesh = new THREE.Mesh(
                            new THREE.SphereGeometry(0.08, 12, 12),
                            new THREE.MeshPhongMaterial({ color: 0x00ffff, emissive: 0x006666 })
                        );
                        mesh.position.set(p.x, p.y, p.z || 0);
                        this.groups.particles.add(mesh);
                    }
                    if (p.hitPoint) {
                        const mesh = new THREE.Mesh(
                            new THREE.SphereGeometry(0.06, 10, 10),
                            new THREE.MeshPhongMaterial({ color: 0xff0080, emissive: 0x880044 })
                        );
                        mesh.position.set(p.hitPoint.x, p.hitPoint.y, p.hitPoint.z || 0);
                        this.groups.hitPoints.add(mesh);
                    }
                });
            },

            updateTrails(particles) {
                while (this.groups.trails.children.length > particles.length) {
                    const c = this.groups.trails.children[particles.length];
                    this.groups.trails.remove(c);
                    if (c.geometry) c.geometry.dispose();
                    if (c.material) c.material.dispose();
                }

                particles.forEach((p, i) => {
                    if (p.trail.length < 2) return;
                    const pos = [];
                    p.trail.forEach(pt => pos.push(pt.x, pt.y, pt.z || 0));
                    const geom = new THREE.BufferGeometry();
                    geom.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));

                    if (i < this.groups.trails.children.length) {
                        const old = this.groups.trails.children[i];
                        if (old.geometry) old.geometry.dispose();
                        old.geometry = geom;
                    } else {
                        this.groups.trails.add(new THREE.Line(
                            geom,
                            new THREE.LineBasicMaterial({ color: 0x00ff88, transparent: true, opacity: 0.7 })
                        ));
                    }
                });
            },

            addLabel(text, x, y, size, color) {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 256;
                canvas.height = 64;
                ctx.font = 'bold 28px Arial';
                ctx.fillStyle = '#' + new THREE.Color(color).getHexString();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.strokeStyle = 'rgba(0,0,0,0.7)';
                ctx.lineWidth = 4;
                ctx.strokeText(text, 128, 32);
                ctx.fillText(text, 128, 32);
                const sprite = new THREE.Sprite(
                    new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true })
                );
                sprite.position.set(x, y, 0.15);
                sprite.scale.set(size * 4, size, 1);
                this.groups.annotations.add(sprite);
            },

            render() {
                this.controls.update();
                this.renderer.render(this.scene, this.camera);
            }
        };

        // ================================================================
        //  Simulator - 物理仿真引擎（基于 PhysSim.SimulationManager）
        //  职责: 粒子发射、物理步进、边界检测
        //  数据: 使用 PhysSim 引擎进行物理计算
        // ================================================================
        const Simulator = {
            simId: null,
            particles: [],
            time: 0,
            electronCount: 0,
            hitCount: 0,
            currentAngle: 0,
            currentSpec: null,
            currentConfig: null,
            isRunning: false,

            reset() {
                if (this.simId) {
                    PhysVis.SimulationManager.destroy(this.simId);
                    this.simId = null;
                }
                this.particles = [];
                this.time = 0;
                this.electronCount = 0;
                this.hitCount = 0;
                this.currentAngle = 0;
                this.isRunning = false;
            },

            setContext(spec, config) {
                this.currentSpec = spec;
                this.currentConfig = config;
            },

            emitSingle(angle, speedMul) {
                const config = this.currentConfig;
                const spec = this.currentSpec;
                if (!config || !spec) return;

                // 如果还没有创建仿真，则创建一个新的
                if (!this.simId) {
                    this.simId = PhysVis.SimulationManager.createSimulation(spec, { trailLength: 2000 });
                    
                    // 注册渲染回调
                    PhysVis.SimulationManager.onRenderUpdate(this.simId, (states, stepCount) => {
                        this.particles = states.map(s => ({
                            x: s.position.x,
                            y: s.position.y,
                            z: s.position.z,
                            vx: s.velocity.x,
                            vy: s.velocity.y,
                            vz: s.velocity.z,
                            alive: s.alive,
                            trail: s.trail,
                            hitPoint: s.hitPoint,
                            age: this.time
                        }));
                    });
                }

                const given = config.given || {};
                const speed = (given.initialVelocity || 1.0) * (speedMul || 1.0);

                // 添加新粒子到仿真中
                const simData = PhysVis.SimulationManager._simulations.get(this.simId);
                if (simData) {
                    simData.simulation.addParticle(
                        new PhysSim.Vec3(0, 0, 0),
                        new PhysSim.Vec3(speed * Math.cos(angle), speed * Math.sin(angle), 0),
                        given.electronCharge !== undefined ? given.electronCharge : -1,
                        given.electronMass !== undefined ? given.electronMass : 1
                    );
                }

                this.electronCount++;
                this.currentAngle = angle;
            },

            emitMultiple(count) {
                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2;
                    setTimeout(() => this.emitSingle(angle), i * 30);
                }
            },

            step(dt) {
                if (!this.simId) return;
                
                const hasAlive = PhysVis.SimulationManager.step(this.simId, dt);
                this.time += dt;
                
                if (!hasAlive) {
                    this.isRunning = false;
                }
            },

            start() {
                this.isRunning = true;
            },

            stop() {
                this.isRunning = false;
            }
        };

        // ================================================================
        //  UIManager - UI面板管理
        //  职责: 题目面板、控制面板、信息面板、推导面板的构建和更新
        // ================================================================
        const UIManager = {
            buildTabs(problems) {
                const container = document.getElementById('tabs');
                container.innerHTML = '';
                problems.forEach((p, i) => {
                    const tab = document.createElement('button');
                    tab.className = 'tab' + (i === 0 ? ' active' : '');
                    tab.textContent = p.title;
                    tab.dataset.id = p.id;
                    tab.addEventListener('click', () => App.loadProblem(p.id));
                    container.appendChild(tab);
                });
            },

            buildControlPanel() {
                document.getElementById('control-panel').innerHTML = `
                    <div class="section"><div class="sec-title">播放控制</div>
                        <div class="btn-row">
                            <button class="btn" id="btn-play">播放</button>
                            <button class="btn" id="btn-reset">重置</button>
                        </div>
                        <div style="font-size:11px;color:rgba(255,255,255,0.5);margin-bottom:4px;">速度</div>
                        <input type="range" id="speed-slider" min="0.1" max="3" step="0.1" value="1.0" style="width:100%;">
                        <div style="text-align:right;font-size:11px;color:#00d4ff;" id="speed-display">1.0x</div>
                    </div>
                    <div class="section"><div class="sec-title">发射模式</div>
                        <div class="mode-grid">
                            <button class="mode-btn active" data-mode="single">单粒子</button>
                            <button class="mode-btn" data-mode="multi">多角度</button>
                            <button class="mode-btn" data-mode="continuous">连续</button>
                            <button class="mode-btn" data-mode="verify">验证选项</button>
                        </div>
                    </div>
                    <div class="section"><div class="sec-title">参数</div>
                        <div class="param-box" id="param-box"></div>
                    </div>
                    <div class="section"><div class="sec-title">显示</div>
                        <label class="check-label"><input type="checkbox" id="chk-trails" checked> 轨迹</label>
                        <label class="check-label"><input type="checkbox" id="chk-hits" checked> 击中点</label>
                        <label class="check-label"><input type="checkbox" id="chk-field" checked> 场符号</label>
                    </div>
                `;
            },

            buildInfoPanel() {
                document.getElementById('info-panel').innerHTML = `
                    <div class="sec-title">实时测量</div>
                    <div class="info-grid">
                        <div class="info-cell"><div class="info-lbl">角度</div><div class="info-val" id="v-angle">0</div></div>
                        <div class="info-cell"><div class="info-lbl">半径</div><div class="info-val" id="v-r">2.00</div></div>
                        <div class="info-cell"><div class="info-lbl">击中x</div><div class="info-val" id="v-hitx">-</div></div>
                        <div class="info-cell"><div class="info-lbl">时间</div><div class="info-val" id="v-time">0.00</div></div>
                        <div class="info-cell"><div class="info-lbl">发射数</div><div class="info-val" id="v-count">0</div></div>
                        <div class="info-cell"><div class="info-lbl">击中数</div><div class="info-val" id="v-hits">0</div></div>
                    </div>
                `;
            },

            updateInfoPanel() {
                document.getElementById('v-angle').textContent = (Simulator.currentAngle * 180 / Math.PI).toFixed(1) + '\u00B0';
                const config = PhysVis.ProblemRegistry.get(App.currentProblemId);
                const R = (config && config.given && config.given.radius) || 2.0;
                document.getElementById('v-r').textContent = R.toFixed(2) + 'd';
                const lastHit = Simulator.particles.filter(p => p.hitPoint).pop();
                document.getElementById('v-hitx').textContent = lastHit ? lastHit.hitPoint.x.toFixed(3) : '-';
                document.getElementById('v-time').textContent = Simulator.time.toFixed(2);
                document.getElementById('v-count').textContent = Simulator.electronCount;
                document.getElementById('v-hits').textContent = Simulator.hitCount;
            },

            buildProblemPanel(config) {
                const panel = document.getElementById('problem-panel');
                panel.innerHTML = `
                    <h1>${config.title}</h1>
                    <div class="source">${config.source}</div>
                    <div class="problem-text">${config.description}</div>
                    ${(config.formulas || []).map(f => '<div class="formula">' + f + '</div>').join('')}
                    <div style="margin-top:12px;font-size:13px;font-weight:600;color:#00d4ff;">下列说法正确的是：</div>
                    <div class="options-list">
                        ${(config.options || []).map(o => `
                            <div class="option-item" data-option="${o.letter}">
                                <div class="opt-letter">${o.letter}</div>
                                <div class="opt-text">${o.text}</div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="answer-box" id="answer-box">
                        <div style="font-size:14px;font-weight:600;color:#00ff88;margin-bottom:8px;">正确答案：${config.answer.correct.join('、')}</div>
                        <div>${config.answer.explanation}</div>
                    </div>
                `;
                panel.querySelectorAll('.option-item').forEach(item => {
                    item.addEventListener('click', () => {
                        panel.querySelectorAll('.option-item').forEach(i => i.classList.remove('selected'));
                        item.classList.add('selected');
                        App.demonstrateOption(item.dataset.option);
                        App.showDerivStep(item.dataset.option);
                    });
                });

                const given = config.given || {};
                const labels = {
                    plateSeparation: '板间距', d: 'd', magneticField: 'B',
                    electricField: 'E', initialVelocity: 'v\u2080', radius: 'R'
                };
                document.getElementById('param-box').innerHTML = Object.entries(given)
                    .filter(([k]) => labels[k])
                    .map(([k, v]) => '<div class="param-row"><span class="param-label">' + labels[k] + '</span><span class="param-val">' + (typeof v === 'number' ? v.toFixed(2) : v) + '</span></div>')
                    .join('');
            },

            buildDerivPanel(problemId) {
                const panel = document.getElementById('deriv-panel');
                if (problemId === 'baiyin-sanmo-2025') {
                    panel.innerHTML = `
                        <div class="sec-title" style="color:#ffc800;border-bottom-color:rgba(255,200,0,0.3);">计算推导</div>
                        <div class="deriv-tabs">
                            <button class="deriv-tab active" data-d="all">全部</button>
                            <button class="deriv-tab" data-d="A">A 半径</button>
                            <button class="deriv-tab" data-d="B">B 周期</button>
                            <button class="deriv-tab" data-d="C">C 区域</button>
                            <button class="deriv-tab" data-d="D">D 击中率</button>
                        </div>
                        <div class="deriv-step" data-s="A">
                            <div class="deriv-title"><div class="deriv-num">A</div>求轨迹半径 R</div>
                            <div class="deriv-line"><span class="note">洛伦兹力提供向心力：</span></div>
                            <div class="deriv-line"><span class="eq">ev\u2080B</span> = <span class="eq">mv\u2080\u00B2/R</span></div>
                            <div class="deriv-line">\u2192 R = <span class="eq">mv\u2080/(eB)</span></div>
                            <div class="deriv-line"><span class="note">代入 B = mv\u2080/(2ed)：</span></div>
                            <div class="deriv-line">R = mv\u2080 / (e \u00B7 <span class="eq">mv\u2080/(2ed)</span>)</div>
                            <div class="deriv-line">R = <span class="res">2d</span> \u2713</div>
                            <div class="conclusion ok">\u2705 选项A正确：R = 2d</div>
                        </div>
                        <div class="deriv-step" data-s="B">
                            <div class="deriv-title"><div class="deriv-num">B</div>求运动周期 T</div>
                            <div class="deriv-line">T = <span class="eq">2\u03C0R/v\u2080</span></div>
                            <div class="deriv-line">T = 2\u03C0 \u00B7 <span class="eq">2d</span> / v\u2080</div>
                            <div class="deriv-line">T = <span class="res">4\u03C0d/v\u2080</span></div>
                            <div class="deriv-line"><span class="note">选项B给出：</span> <span class="wrong">T = \u03C0d/v\u2080</span></div>
                            <div class="conclusion no">\u274C 选项B错误：T = 4\u03C0d/v\u2080 \u2260 \u03C0d/v\u2080</div>
                        </div>
                        <div class="deriv-step" data-s="C">
                            <div class="deriv-title"><div class="deriv-num">C</div>求击中区域总长度</div>
                            <div class="deriv-line"><span class="note">圆心坐标：(2d\u00B7sin\u03B8, -2d\u00B7cos\u03B8)</span></div>
                            <div class="deriv-line"><span class="note">打到右板(x=2d)：sin\u03B8 \u2265 0</span></div>
                            <div class="deriv-line">最低点 y = <span class="eq">-2d</span>（\u03B8=0）</div>
                            <div class="deriv-line">最高点 y = <span class="eq">2\u221A3\u00B7d</span></div>
                            <div class="deriv-line">右板长度 = <span class="eq">2(\u221A3+1)d</span></div>
                            <div class="deriv-line"><span class="note">左板对称，总长度：</span></div>
                            <div class="deriv-line">L = 2 \u00D7 2(\u221A3+1)d = <span class="res">4(\u221A3+1)d</span></div>
                            <div class="conclusion ok">\u2705 选项C正确</div>
                        </div>
                        <div class="deriv-step" data-s="D">
                            <div class="deriv-title"><div class="deriv-num">D</div>求击中率</div>
                            <div class="deriv-line"><span class="note">R = 2d = S到极板距离</span></div>
                            <div class="deriv-line">上半方向 \u2192 右板</div>
                            <div class="deriv-line">下半方向 \u2192 左板</div>
                            <div class="deriv-line">所有电子都打到极板</div>
                            <div class="deriv-line">击中率 = <span class="res">100%</span></div>
                            <div class="deriv-line"><span class="note">选项D给出：</span> <span class="wrong">50%</span></div>
                            <div class="conclusion no">\u274C 选项D错误：击中率=100%</div>
                        </div>
                    `;
                    panel.querySelectorAll('.deriv-tab').forEach(tab => {
                        tab.addEventListener('click', () => App.showDeriv(tab.dataset.d));
                    });
                } else {
                    panel.innerHTML = '<div class="sec-title" style="color:#ffc800;">推导过程</div><div style="font-size:12px;color:rgba(255,255,255,0.5);">选择白银三模题目查看详细推导</div>';
                }
            }
        };

        // ================================================================
        //  App - 唯一状态管理中心
        //  职责: 协调 Renderer3D / Simulator / UIManager，管理全局状态
        //  数据流: ProblemConfig → SceneSpec → Renderer3D + Simulator
        // ================================================================
        const App = {
            currentProblemId: null,
            isPlaying: false,
            speedMul: 1.0,
            animId: null,
            continuousTimer: 0,

            init() {
                try {
                    Renderer3D.init(document.getElementById('canvas-container'));
                    Simulator.reset();

                    SceneTemplates.registerAll();
                    PhysVis.ProblemRegistry.register(BaiyinSanmoProblem);
                    PhysVis.ProblemRegistry.register(VelocitySelectorProblem);
                    PhysVis.ProblemRegistry.register(ParallelPlateElectricProblem);

                    UIManager.buildTabs(PhysVis.ProblemRegistry.list());
                    UIManager.buildControlPanel();
                    UIManager.buildInfoPanel();
                    this.bindEvents();

                    const first = PhysVis.ProblemRegistry.list()[0];
                    if (first) this.loadProblem(first.id);

                    this.startLoop();

                    setTimeout(() => {
                        document.getElementById('loading').classList.add('hidden');
                    }, 400);

                } catch (err) {
                    console.error('Init failed:', err);
                    document.getElementById('loading').innerHTML =
                        '<div class="error-msg"><h2>初始化失败</h2><p>' + err.message + '</p></div>';
                }
            },

            loadProblem(id) {
                this.currentProblemId = id;
                this.resetSim();

                const config = PhysVis.ProblemRegistry.get(id);
                if (!config) return;

                document.querySelectorAll('.tab').forEach(t =>
                    t.classList.toggle('active', t.dataset.id === id)
                );

                const spec = PhysVis.SceneBuilder.build(config);
                Simulator.setContext(spec, config);
                Renderer3D.buildSceneFromSpec(spec);
                UIManager.buildProblemPanel(config);
                UIManager.buildDerivPanel(config.id);
            },

            resetSim() {
                Simulator.reset();
                this.isPlaying = false;
                this.continuousTimer = 0;
                Renderer3D.clearGroup('particles');
                Renderer3D.clearGroup('trails');
                Renderer3D.clearGroup('hitPoints');
                Renderer3D.clearGroup('annotations');
                const btn = document.getElementById('btn-play');
                if (btn) { btn.textContent = '播放'; btn.classList.remove('active'); }
            },

            startLoop() {
                if (this.animId) cancelAnimationFrame(this.animId);
                const loop = () => {
                    this.animId = requestAnimationFrame(loop);
                    if (this.isPlaying && Simulator.isRunning) {
                        const dt = 0.016 * this.speedMul;
                        Simulator.step(dt);
                        this.continuousTimer += dt;

                        const activeMode = document.querySelector('.mode-btn.active');
                        if (activeMode && activeMode.dataset.mode === 'continuous' && this.continuousTimer > 0.08) {
                            this.continuousTimer = 0;
                            Simulator.emitSingle(Math.random() * Math.PI * 2);
                        }

                        Renderer3D.updateParticles(Simulator.particles);
                        Renderer3D.updateTrails(Simulator.particles);
                        UIManager.updateInfoPanel();
                    }
                    Renderer3D.render();
                };
                loop();
            },

            demonstrateOption(letter) {
                this.resetSim();
                const config = PhysVis.ProblemRegistry.get(this.currentProblemId);
                if (!config) return;
                const opt = config.options.find(o => o.letter === letter);
                if (!opt || !opt.verification) return;

                const mode = opt.verification.demonstrateMode;
                if (mode === 'single_right') Simulator.emitSingle(0);
                else if (mode === 'single_up') Simulator.emitSingle(Math.PI / 2);
                else if (mode === 'single_fast') Simulator.emitSingle(0, 1.5);
                else if (mode === 'multi_72' || mode === 'multi_100') Simulator.emitMultiple(72);
                else Simulator.emitSingle(0);

                this.isPlaying = true;
                const btn = document.getElementById('btn-play');
                btn.textContent = '暂停';
                btn.classList.add('active');
            },

            showDeriv(step) {
                document.querySelectorAll('.deriv-tab').forEach(t =>
                    t.classList.toggle('active', t.dataset.d === step)
                );
                document.querySelectorAll('.deriv-step').forEach(s => {
                    s.style.display = (step === 'all' || s.dataset.s === step) ? 'block' : 'none';
                });
                this.addAnnotation(step);
            },

            showDerivStep(letter) {
                this.showDeriv(letter);
            },

            addAnnotation(step) {
                Renderer3D.clearGroup('annotations');
                const R = 2.0;
                if (step === 'A' || step === 'all') {
                    const pts = [new THREE.Vector3(0, 0, 0.1), new THREE.Vector3(R, 0, 0.1)];
                    const mat = new THREE.LineDashedMaterial({
                        color: 0xffff00, dashSize: 0.15, gapSize: 0.08,
                        transparent: true, opacity: 0.8
                    });
                    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat);
                    line.computeLineDistances();
                    Renderer3D.groups.annotations.add(line);
                    Renderer3D.addLabel('R=2d', R / 2, 0.3, 0.15, 0xffff00);
                }
                if (step === 'C' || step === 'all') {
                    const sqrt3d = Math.sqrt(3);
                    const topY = 2 * sqrt3d, botY = -2;
                    const hlR = new THREE.Mesh(
                        new THREE.PlaneGeometry(0.3, topY - botY),
                        new THREE.MeshBasicMaterial({ color: 0xff4444, transparent: true, opacity: 0.25, side: THREE.DoubleSide })
                    );
                    hlR.position.set(2.2, (topY + botY) / 2, 0.05);
                    Renderer3D.groups.annotations.add(hlR);

                    const hlL = new THREE.Mesh(
                        new THREE.PlaneGeometry(0.3, topY - botY),
                        new THREE.MeshBasicMaterial({ color: 0x4488ff, transparent: true, opacity: 0.25, side: THREE.DoubleSide })
                    );
                    hlL.position.set(-2.2, (topY + botY) / 2, 0.05);
                    Renderer3D.groups.annotations.add(hlL);

                    Renderer3D.addLabel('2\u221A3d', 2.6, topY - 0.3, 0.12, 0xff4444);
                    Renderer3D.addLabel('-2d', 2.6, botY + 0.3, 0.12, 0xff4444);
                    Renderer3D.addLabel('L=4(\u221A3+1)d', 0, -4.5, 0.15, 0x00ff88);
                }
                if (step === 'D' || step === 'all') {
                    for (let i = 0; i < 12; i++) {
                        const a = (i / 12) * Math.PI * 2;
                        Renderer3D.groups.annotations.add(new THREE.ArrowHelper(
                            new THREE.Vector3(Math.cos(a), Math.sin(a), 0),
                            new THREE.Vector3(0, 0, 0.1), 1.5, 0x00ff88, 0.12, 0.06
                        ));
                    }
                    Renderer3D.addLabel('100%击中', 0, -3.5, 0.18, 0x00ff88);
                }
            },

            bindEvents() {
                document.getElementById('btn-play').addEventListener('click', () => {
                    this.isPlaying = !this.isPlaying;
                    const btn = document.getElementById('btn-play');
                    btn.textContent = this.isPlaying ? '暂停' : '播放';
                    btn.classList.toggle('active', this.isPlaying);
                    if (this.isPlaying && Simulator.particles.length === 0) {
                        Simulator.emitSingle(0);
                        Simulator.start();
                    } else if (this.isPlaying) {
                        Simulator.start();
                    } else {
                        Simulator.stop();
                    }
                });

                document.getElementById('btn-reset').addEventListener('click', () => this.resetSim());

                document.getElementById('speed-slider').addEventListener('input', (e) => {
                    this.speedMul = parseFloat(e.target.value);
                    document.getElementById('speed-display').textContent = this.speedMul.toFixed(1) + 'x';
                });

                document.querySelectorAll('.mode-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.resetSim();
                        const mode = btn.dataset.mode;
                        if (mode === 'single') { Simulator.emitSingle(0); }
                        else if (mode === 'multi') { Simulator.emitMultiple(36); }
                        this.isPlaying = true;
                        Simulator.start();
                        document.getElementById('btn-play').textContent = '暂停';
                        document.getElementById('btn-play').classList.add('active');
                    });
                });

                document.getElementById('chk-trails').addEventListener('change', (e) => {
                    Renderer3D.groups.trails.visible = e.target.checked;
                });
                document.getElementById('chk-hits').addEventListener('change', (e) => {
                    Renderer3D.groups.hitPoints.visible = e.target.checked;
                });
                document.getElementById('chk-field').addEventListener('change', (e) => {
                    Renderer3D.groups.fields.visible = e.target.checked;
                });

                document.getElementById('btn-reveal').addEventListener('click', () => {
                    const box = document.getElementById('answer-box');
                    if (box) box.classList.toggle('visible');
                    const config = PhysVis.ProblemRegistry.get(this.currentProblemId);
                    if (config) {
                        document.querySelectorAll('.option-item').forEach(item => {
                            const letter = item.dataset.option;
                            item.classList.toggle('correct', config.answer.correct.includes(letter));
                            item.classList.toggle('wrong', !config.answer.correct.includes(letter));
                        });
                    }
                });
            }
        };

        window.App = App;
        App.init();
    })();
    </script>
</body>

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            physics-core/package-lock.json
            visualization/package-lock.json

      - name: 安装根依赖
        run: npm ci

      - name: 安装 physics-core 依赖
        run: npm ci
        working-directory: physics-core

      - name: 安装 visualization 依赖
        run: npm ci
        working-directory: visualization

      - name: 构建 physics-core（visualization 依赖其 dist）
        run: npm run build
        working-directory: physics-core

      - name: TypeScript 类型检查
        run: |
          cd physics-core && npx tsc --noEmit && cd ../visualization && npx tsc --noEmit

      - name: ESLint 静态分析
        run: npm run lint

      - name: Prettier 格式检查
        run: npm run format:check

      - name: 单元测试（physics-core）
        run: npm test
        working-directory: physics-core

      - name: 单元测试（visualization）
        run: npm test
        working-directory: visualization

      - name: 7 层物理自检
        run: node scripts/self-check.mjs

      - name: 构建 visualization
        run: npm run build
        working-directory: visualization
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: visualization-dist
          path: visualization/dist
          retention-days: 7

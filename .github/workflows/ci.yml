name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装全部依赖 (npm workspaces)
        run: npm ci

      - name: 构建 physics-core（visualization 依赖其 dist）
        run: npm run build
        working-directory: physics-core

      - name: TypeScript 类型检查
        run: |
          cd physics-core && npx tsc --noEmit -p tsconfig.typecheck.json && cd ../visualization && npx tsc --noEmit

      - name: ESLint 静态分析
        run: npm run lint

      - name: Prettier 格式检查
        run: npm run format:check

      - name: 测试断言空转扫描 (#84)
        run: node scripts/sweep-swallowed-assertions.mjs

      - name: 单元测试（physics-core）
        run: npm test
        working-directory: physics-core

      - name: 单元测试（visualization）
        run: npm test
        working-directory: visualization

      - name: 测试数与文档一致性校验
        run: node scripts/count-tests.mjs --check --from-report

      - name: 11 层物理自检
        run: node scripts/self-check.mjs

      - name: 构建 visualization
        run: npm run build
        working-directory: visualization
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: 首屏包体积门禁 (≤70kB gzip)
        run: node scripts/check-bundle-size.mjs

      - name: physics-core 发布 dry-run 门禁 (#107, 不发布/不触网/无 token)
        run: node scripts/check-publish-dryrun.mjs

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: visualization-dist
          path: visualization/dist
          retention-days: 7

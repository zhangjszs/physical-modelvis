name: QA 场景巡检

# 为什么单独一条流水线：CI 的 7 道门禁全部只看代码与引擎数值，**没有一道看过画面**。
# issue #69 那个「3D 场景切换后舞台永久空白、101/123 场景受影响」的 P0，
# 是在 CI 连续全绿的状态下存在的。本流水线补上"渲染是否真的发生"这一层。
#
# 口径分两档（见 scripts/verify-qa-sweep.cjs 的 QA_STRICT）：
#   pull_request → smoke（目录前 12 个场景）+ 只拦「舞台未渲染 / 场景打不开」，
#                  console 报错降级为 WARN 仍上报，避免被已知存量问题卡死正常 PR；
#   schedule / 手动 → full（全部 123 场景）+ 严格口径，任何 ERROR 都让 nightly 变红。

on:
    pull_request:
        branches: [main]
    schedule:
        - cron: '30 18 * * *' # 每日 UTC 18:30（北京时间 02:30）
    workflow_dispatch:

permissions:
    contents: read

jobs:
    qa-sweep:
        name: 逐场景巡检（浏览器）
        runs-on: ubuntu-latest
        # 实测：nightly 全量（123 场景 + 逐参数 min/max 边界扫描）在 CI 上约 20-30 分钟，
        # PR smoke（12 场景）约 3-5 分钟。留 45 分钟余量，避免被 timeout 误判为流水线坏。
        timeout-minutes: 45
        env:
            # PR → 只跑前 12 个场景且用 canvas 口径；定时/手动 → 全量且严格
            QA_LIMIT: ${{ github.event_name == 'pull_request' && '12' || '0' }}
            QA_STRICT: ${{ github.event_name == 'pull_request' && 'canvas' || 'error' }}
            QA_BASE: http://localhost:5199/
            QA_OUT: qa-sweep.json
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: 安装全部依赖（npm workspaces）
              run: npm ci

            - name: 构建 physics-core（visualization 依赖其 dist）
              run: npm run build
              working-directory: physics-core

            - name: 安装 Playwright Chromium
              run: npx playwright install --with-deps chromium

            - name: 启动 dev server（后台）
              run: nohup npx vite --port 5199 --strictPort > /tmp/vite.log 2>&1 &
              working-directory: visualization

            - name: 等待 dev server 就绪
              run: |
                  for i in $(seq 1 60); do
                    if curl -sf "$QA_BASE" > /dev/null; then
                      echo "dev server 已就绪（第 $i 次探测）"
                      exit 0
                    fi
                    sleep 2
                  done
                  echo "!! dev server 60 次探测后仍未就绪"
                  tail -40 /tmp/vite.log
                  exit 1

            - name: 运行场景巡检
              run: node scripts/verify-qa-sweep.cjs

            - name: 输出 dev server 日志（仅失败时）
              if: failure()
              run: tail -60 /tmp/vite.log || true

            - name: 上传巡检报告
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: qa-sweep-report-${{ github.run_number }}
                  path: qa-sweep.json
                  if-no-files-found: warn
                  retention-days: 14

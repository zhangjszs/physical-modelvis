name: 💡 功能或场景建议 (Feature Request)
description: 建议新增物理教学场景、交互功能或改进现有体验
title: "[Feature]: "
labels: ["needs-triage", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢为 PhysVis 提出建议！请描述您的教学或仿真场景需求。
  - type: textarea
    id: summary
    attributes:
      label: 需求或功能描述
      description: 清晰简要地说明希望新增或改进的功能
    validations:
      required: true
  - type: textarea
    id: teaching-context
    attributes:
      label: 物理教学场景 / 动机
      description: 这个功能或场景对应高中物理的哪部分知识点？在课堂演示或学生自主探究中能解决什么痛点？
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: 建议实现方案
      description: 若您已有初步构想（如需要哪些调节参数、哪些曲线图表、2D 还是 3D 展示），请在此描述
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 是否考虑过其它实现途径？
